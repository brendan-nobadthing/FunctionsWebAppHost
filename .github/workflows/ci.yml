name: Build, test and publish

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"
      - name: Determine package version
        shell: bash
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            version="${GITHUB_REF_NAME#v}"
            if [[ ! "$version" =~ ^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(-[0-9A-Za-z]+([.-][0-9A-Za-z]+)*)?$ ]]; then
              echo "::error::Expected a semantic version tag such as v0.1.0 or v0.1.0-alpha.1"
              exit 1
            fi
            echo "PACKAGE_VERSION=$version" >> "$GITHUB_ENV"
          fi
      - run: dotnet restore FunctionsWebAppHost.slnx
      - name: Build
        shell: bash
        run: |
          args=()
          if [[ -n "$PACKAGE_VERSION" ]]; then
            args+=("-p:Version=$PACKAGE_VERSION")
          fi
          dotnet build FunctionsWebAppHost.slnx --configuration Release --no-restore -p:ContinuousIntegrationBuild=true "${args[@]}"
      - run: dotnet test tests/FunctionsWebAppHost.Tests/FunctionsWebAppHost.Tests.csproj --configuration Release --no-build --verbosity minimal
      - name: Pack
        shell: bash
        run: |
          args=()
          if [[ -n "$PACKAGE_VERSION" ]]; then
            args+=("-p:Version=$PACKAGE_VERSION")
          fi
          dotnet pack src/FunctionsWebAppHost/FunctionsWebAppHost.csproj --configuration Release --no-build --output artifacts "${args[@]}"
      - uses: actions/upload-artifact@v4
        with:
          name: nuget-packages
          path: |
            artifacts/*.nupkg
            artifacts/*.snupkg
          if-no-files-found: error

  publish:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    environment: nuget
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"
      - uses: actions/download-artifact@v4
        with:
          name: nuget-packages
          path: artifacts
      - name: Log in to NuGet.org using OIDC
        uses: NuGet/login@v1
        id: login
        with:
          user: ${{ vars.NUGET_USER }}
      - name: Publish to NuGet.org
        env:
          NUGET_API_KEY: ${{ steps.login.outputs.NUGET_API_KEY }}
        shell: bash
        run: |
          dotnet nuget push "artifacts/*.nupkg" --api-key "$NUGET_API_KEY" --source https://api.nuget.org/v3/index.json
